# Configurações otimizadas de memória para Gradle
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Habilitar AndroidX e Jetifier (essencial para compatibilidade)
android.useAndroidX=true
android.enableJetifier=true

# Habilitar cache e paralelização do Gradle (melhora performance)
org.gradle.caching=true
org.gradle.parallel=true

# Evitar warnings de daemon
org.gradle.daemon=true

# Kotlin incremental compilation (melhora velocidade)
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
