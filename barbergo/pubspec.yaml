name: barbergo_app
description: A Flutter app that connects barbers and barbershops for freelance, CLT and commission opportunities.

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core:
  cloud_firestore:
  firebase_auth:
  firebase_storage:
  flutter_riverpod:
  riverpod_annotation:
  go_router:
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  cached_network_image:
  intl:
  flutter_card_swiper: ^7.0.2
  google_generative_ai: ^0.4.7
  openai_dart: ^0.5.5
  anthropic_sdk_dart: ^0.2.3
  flutter_dotenv: ^6.0.0
  flutter_markdown: ^0.7.4
  uuid: ^4.5.1
  firebase_analytics: ^12.0.3
  firebase_crashlytics: ^5.0.3
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^3.1.0
  json_serializable: ^6.8.0
  riverpod_generator:
  flutter_lints:

flutter:
  assets:
    - .env
