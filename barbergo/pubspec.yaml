name: barbergo_app
description: A Flutter app that connects barbers and barbershops for freelance, CLT and commission opportunities.

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core:
  cloud_firestore:
  firebase_auth:
  firebase_storage:
  flutter_riverpod:
  riverpod_annotation:
  go_router:
  freezed_annotation:
  json_annotation:
  cached_network_image:
  intl:

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  freezed:
  json_serializable:
  riverpod_generator:
  flutter_lints:
