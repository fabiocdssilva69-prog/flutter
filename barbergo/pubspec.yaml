name: barbergo_app
description: "BarberGO - Conectando Barbeiros e Barbearias."
publish_to: 'none'

# Define a versão inicial para o Beta
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core:
  cloud_firestore:
  firebase_auth:
  firebase_storage: ^13.0.3
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  go_router: ^14.0.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  flutter_card_swiper: ^7.0.2
  dio: ^5.7.0
  permission_handler: ^11.2.0
  geocoding: ^3.0.0
  image_cropper: ^8.0.2
  google_generative_ai: ^0.4.7
  openai_dart: ^0.5.5
  anthropic_sdk_dart: ^0.2.3
  flutter_dotenv: ^6.0.0
  flutter_markdown: ^0.7.7+1
  uuid: ^4.5.1
  firebase_analytics: ^12.0.3
  firebase_crashlytics: ^5.0.3
  firebase_remote_config: ^6.1.0
  rxdart: ^0.28.0
  firebase_messaging: ^16.0.3
  dart_mappable: ^4.6.1
  geolocator: ^14.0.2
  geoflutterfire_plus: ^0.0.33
  image_picker: ^1.2.0
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  synchronized: ^3.4.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  timeago: ^3.6.1
  confetti: ^0.8.0
  photo_view: ^0.15.0
  google_maps_flutter: ^2.13.1
  lottie: ^3.3.2
  http: ^1.5.0
  table_calendar: ^3.2.0
  purchases_flutter: ^9.9.1
  reorderables: ^0.6.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0              # QR Code para PIX
  fl_chart: ^0.68.0               # Gráficos BI Dashboard
  # speech_to_text: ^6.6.0          # Voz para texto (acessibilidade) - COMENTADO: incompatibilidade Android
  # flutter_tts: ^3.8.0             # Texto para voz (acessibilidade) - COMENTADO: dependência do speech_to_text

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  riverpod_generator: ^3.0.3
  analyzer: 7.5.9  # TESTE 10: versão 7.5.x compila sem erros Freezed (máximo compatível com dart_mappable)
  flutter_lints:
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.0.0
  firebase_auth_mocks: ^0.15.1
  dart_mappable_builder: ^4.6.0
  test: ^1.25.8
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  assets:
    - .env
    - assets/icons/app_icon.png

# Configuração dos Ícones do Aplicativo
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
