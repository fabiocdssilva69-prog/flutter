workflows:

  # ─── TESTE RÁPIDO (sem conta Apple paga) ───────────────────────────────────
  # Builda IPA sem assinatura → instalar via Sideloadly no PC do testador
  ios-testing:
    name: iOS Testing Build (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Inject GoogleService-Info.plist
        script: |
          echo $CM_GOOGLESERVICE_INFO_PLIST | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Disable Swift Package Manager
        script: flutter config --no-enable-swift-package-manager

      - name: Build IPA (sem assinatura)
        script: |
          flutter build ipa --no-codesign
          # Empacota o .app em IPA manualmente
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app \
                build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r BarberGO.ipa Payload/

    artifacts:
      - build/ios/ipa/BarberGO.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - fabiocds.silva69@gmail.com
          - brunobiguacu@gmail.com
        notify:
          success: true
          failure: true

  # ─── TESTFLIGHT (conta Apple Developer ativa) ──────────────────────────────
  ios-workflow:
    name: iOS TestFlight Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.barbergo.app"
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_KEY_IDENTIFIER: $APP_STORE_CONNECT_KEY_IDENTIFIER
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY
        CERTIFICATE_PRIVATE_KEY: $CERTIFICATE_PRIVATE_KEY

    scripts:
      - name: Set up keychain
        script: keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Set up code signing
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Inject GoogleService-Info.plist
        script: |
          echo $CM_GOOGLESERVICE_INFO_PLIST | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Disable Swift Package Manager
        script: flutter config --no-enable-swift-package-manager

      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Build IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - fabiocds.silva69@gmail.com
          - brunobiguacu@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-workflow:
    name: Android Release Build
    instance_type: linux_x2
    max_build_duration: 60
    
    environment:
      flutter: stable
      
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release
    
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
    
    publishing:
      email:
        recipients:
          - seu-email@exemplo.com
        notify:
          success: true
          failure: true
